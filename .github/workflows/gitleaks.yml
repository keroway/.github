# このリポジトリ自身の secret スキャン（reusable workflow のセルフ利用）。
#
# main は branch protection で PR 必須化済み（plans/007 Phase 2、2026-08-21）。
# PR の gitleaks チェックが必須状態で通っていることが default branch への
# マージ条件になるため、push トリガーは pull_request と重複するだけで
# 追加の検出価値が無い。週次の全履歴スキャンは新規開示された secret の
# 検知用に維持する。
name: secret-scan

on:
  pull_request:
  schedule:
    - cron: "17 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    # zizmor は self-repository 構文（$/...）を推奨するが、actionlint 1.7.12（2026-09時点の
    # 最新）はこの構文をまだ認識せず invalid format として弾く。actionlint が対応するまでは
    # ./... のままにする（keroway/.github#31）。
    uses: ./.github/workflows/reusable-gitleaks.yml # zizmor: ignore[self-repository] — actionlint 1.7.12が$/構文未対応（keroway/.github#31）
