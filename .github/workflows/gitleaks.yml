# このリポジトリ自身の secret スキャン（reusable workflow のセルフ利用）。
name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    uses: ./.github/workflows/reusable-gitleaks.yml
