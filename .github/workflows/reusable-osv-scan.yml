# osv-scanner による依存脆弱性の横断監査 reusable workflow。
# 呼び出し元テンプレ: templates/workflow-osv-scan.yml
#
# cargo / npm / pnpm / bun のロックファイルをまとめて 1 ツールで監査できるため、
# 個別の `cargo audit` / `pnpm audit` の代わりに（または併用で）使う。
name: reusable-osv-scan

on:
  workflow_call:
    inputs:
      osv-scanner-version:
        type: string
        default: "2.4.0"
      allow-no-package-sources:
        # 「スキャン対象が1つも無い」ことを成功として扱う。既定は false。
        #
        # osv-scanner が認識できないエコシステムだけで構成されたリポジトリ
        # （Gleam/hex の beamsg、Formula だけの homebrew-tap 等）では
        # `No package sources found` で必ず exit 128 になり、main の CI が
        # 恒常的に赤くなる。常に赤いチェックはシグナルとして機能せず、
        # 本物の脆弱性検出と区別できなくなるため、そうしたリポジトリだけが
        # 明示的に opt-in してこの失敗だけを無害化する。
        #
        # 判定は「exit code 128」と「出力に No package sources found を含む」の
        # 両方が揃った場合のみ。無条件に 128 を許容すると、本来スキャンできる
        # リポジトリで対象を取りこぼした場合（lockfile のパス変更など）まで
        # 静かに緑になってしまう。
        #
        # 設計判断の経緯は keroway/beamsg の docs/adr/0028-osv-scan-no-package-sources.md
        type: boolean
        default: false
      runs-on:
        description: >
          実行するランナーのラベル。**JSON 配列の文字列**で渡す
          （workflow_call の input は配列を取れないため `fromJSON` で復元する）。
          例: '["self-hosted","macOS","ARM64"]'。
          private リポジトリの GitHub-hosted 実行は課金対象なので、
          セルフホストランナーがあるリポジトリはそちらを指定する
          （keroway/agent-assets#190）。
        type: string
        default: '["ubuntu-latest"]'

permissions:
  contents: read

jobs:
  scan:
    name: osv-scanner
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install osv-scanner
        env:
          VERSION: ${{ inputs.osv-scanner-version }}
        run: |
          set -euo pipefail
          # 配布物は OS/arch ごとに別ファイル。**未知の環境では推測せず落とす**
          # （間違った URL の 404 より「対応していない」と言う方が読み解ける）。
          case "$(uname -s)/$(uname -m)" in
            Linux/x86_64) asset="osv-scanner_linux_amd64" ;;
            Darwin/arm64) asset="osv-scanner_darwin_arm64" ;;
            *)
              echo "::error::未対応の環境です: $(uname -s)/$(uname -m)"
              exit 1
              ;;
          esac
          # /usr/local/bin への sudo install はやめた。セルフホストランナーでは
          # パスワード無し sudo を前提にできず、**マシンに副作用を残す**ため。
          mkdir -p "$RUNNER_TEMP/osv-bin"
          curl -sSfL "https://github.com/google/osv-scanner/releases/download/v${VERSION}/${asset}" -o "$RUNNER_TEMP/osv-bin/osv-scanner"
          chmod 0755 "$RUNNER_TEMP/osv-bin/osv-scanner"
          echo "$RUNNER_TEMP/osv-bin" >> "$GITHUB_PATH"
      - name: Run osv-scanner
        env:
          # `run:` に式を直接埋め込まず環境変数で受ける（コマンドインジェクション回避）。
          ALLOW_NO_SOURCES: ${{ inputs.allow-no-package-sources }}
        run: |
          set -uo pipefail
          # GitHub Actions の `run:` は bash を `-e` 付きで起動するため、単純な
          # `output="$(cmd)"` だと非ゼロ終了した時点でこのステップが即終了し、
          # 下の分岐に到達しない。`if` の条件部では `-e` が無効化されるので、
          # この形で終了コードを捕捉する。
          if output="$(osv-scanner scan source --recursive . 2>&1)"; then
            status=0
          else
            status=$?
          fi
          printf '%s\n' "$output"

          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          # 「スキャン対象なし」だけを、opt-in したリポジトリに限り成功として扱う。
          # exit code と出力メッセージの両方が一致した場合のみ。
          if [ "$ALLOW_NO_SOURCES" = "true" ] &&
            [ "$status" -eq 128 ] &&
            printf '%s' "$output" | grep -q 'No package sources found'; then
            echo "::notice::osv-scanner found no package sources. Treated as success because allow-no-package-sources=true."
            exit 0
          fi

          exit "$status"
