# workflow / シェルスクリプト / スペルの静的検査をまとめた reusable workflow。
# 呼び出し元テンプレ: templates/workflow-lint.yml
#
# gitleaks-cli と同じ流儀（バージョンをピン留めして GitHub Release のバイナリを直接取得）。
# 4項目は1ジョブ内で実行する。各検査を継続して実行し、最後に集約して失敗させることで、
# 1分未満の個別ジョブに発生する課金単位の重複を避けつつ診断結果を残す。
name: reusable-workflow-lint

on:
  workflow_call:
    inputs:
      actionlint-version:
        type: string
        default: "1.7.12"
      shellcheck-version:
        type: string
        default: "0.11.0"
      typos-version:
        type: string
        default: "1.48.0"
      zizmor-version:
        type: string
        default: "1.28.0"
      shell-paths:
        description: shellcheck の対象パス（スペース区切りの glob）。空なら *.sh を全体から検索
        type: string
        default: ""
      runs-on:
        description: >
          実行するランナーのラベル。**JSON 配列の文字列**で渡す
          （workflow_call の input は配列を取れないため `fromJSON` で復元する）。
          例: '["self-hosted","macOS","ARM64"]'。
          private リポジトリの GitHub-hosted 実行は課金対象なので、
          セルフホストランナーがあるリポジトリはそちらを指定する
          （keroway/agent-assets#190）。
        type: string
        default: '["ubuntu-latest"]'

permissions:
  contents: read

jobs:
  workflow-lint:
    name: workflow-lint
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ツールは $RUNNER_TEMP/lint-bin へ入れて PATH に載せる。
      # /usr/local/bin への sudo install はやめた。セルフホストランナーでは
      # パスワード無し sudo を前提にできず、**マシンに副作用を残す**ため
      # （keroway/agent-assets#190）。
      #
      # 配布物名は 4 ツールとも命名規則が違うので個別に組み立てる。
      # **未知の OS/arch では推測せず落とす** — 間違った URL は 404 になるが、
      # 「なぜか入らない」より「対応していない」と言う方が読み解ける。
      - name: Set up lint bin directory
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lint-bin"
          echo "$RUNNER_TEMP/lint-bin" >> "$GITHUB_PATH"
          case "$(uname -s)/$(uname -m)" in
            Linux/x86_64) ;;
            Darwin/arm64) ;;
            *)
              echo "::error::未対応の環境です: $(uname -s)/$(uname -m)"
              exit 1
              ;;
          esac

      - name: Install actionlint
        env:
          VERSION: ${{ inputs.actionlint-version }}
        run: |
          set -euo pipefail
          case "$(uname -s)/$(uname -m)" in
            Linux/x86_64) asset="actionlint_${VERSION}_linux_amd64.tar.gz" ;;
            Darwin/arm64) asset="actionlint_${VERSION}_darwin_arm64.tar.gz" ;;
          esac
          url="https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${asset}"
          curl -sSfL "$url" -o "$RUNNER_TEMP/actionlint.tar.gz"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/lint-bin" actionlint
          chmod 0755 "$RUNNER_TEMP/lint-bin/actionlint"
      - name: Run actionlint
        id: actionlint
        continue-on-error: true
        run: |
          shopt -s globstar nullglob
          files=(.github/workflows/**/*.yml .github/workflows/**/*.yaml)
          [ "${#files[@]}" -eq 0 ] && { echo "workflow ファイルなし"; exit 0; }
          actionlint "${files[@]}"


      - name: Install zizmor
        env:
          VERSION: ${{ inputs.zizmor-version }}
        run: |
          set -euo pipefail
          case "$(uname -s)/$(uname -m)" in
            Linux/x86_64) asset="zizmor-x86_64-unknown-linux-gnu.tar.gz" ;;
            Darwin/arm64) asset="zizmor-aarch64-apple-darwin.tar.gz" ;;
          esac
          url="https://github.com/zizmorcore/zizmor/releases/download/v${VERSION}/${asset}"
          curl -sSfL "$url" -o "$RUNNER_TEMP/zizmor.tar.gz"
          tar -xzf "$RUNNER_TEMP/zizmor.tar.gz" -C "$RUNNER_TEMP/lint-bin" zizmor
          chmod 0755 "$RUNNER_TEMP/lint-bin/zizmor"
      - name: Run zizmor
        id: zizmor
        continue-on-error: true
        run: |
          [ -d .github/workflows ] || { echo "workflow ディレクトリなし"; exit 0; }
          zizmor --no-online-audits .github/workflows


      - name: Install shellcheck
        env:
          VERSION: ${{ inputs.shellcheck-version }}
        run: |
          set -euo pipefail
          case "$(uname -s)/$(uname -m)" in
            Linux/x86_64) asset="shellcheck-v${VERSION}.linux.x86_64.tar.xz" ;;
            Darwin/arm64) asset="shellcheck-v${VERSION}.darwin.aarch64.tar.xz" ;;
          esac
          url="https://github.com/koalaman/shellcheck/releases/download/v${VERSION}/${asset}"
          curl -sSfL "$url" -o "$RUNNER_TEMP/shellcheck.tar.xz"
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP" "shellcheck-v${VERSION}/shellcheck"
          install -m 0755 "$RUNNER_TEMP/shellcheck-v${VERSION}/shellcheck" "$RUNNER_TEMP/lint-bin/shellcheck"
      - name: Run shellcheck
        id: shellcheck
        continue-on-error: true
        env:
          SHELL_PATHS: ${{ inputs.shell-paths }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob dotglob
          if [ -n "$SHELL_PATHS" ]; then
            # shellcheck disable=SC2206
            files=($SHELL_PATHS)
          else
            files=(**/*.sh)
            files=("${files[@]/#/}")
            filtered=()
            for f in "${files[@]}"; do
              case "$f" in */node_modules/*|*/.git/*) continue ;; esac
              filtered+=("$f")
            done
            files=("${filtered[@]}")
          fi
          [ "${#files[@]}" -eq 0 ] && { echo "対象 .sh なし"; exit 0; }
          shellcheck "${files[@]}"


      - name: Install typos
        env:
          VERSION: ${{ inputs.typos-version }}
        run: |
          set -euo pipefail
          case "$(uname -s)/$(uname -m)" in
            Linux/x86_64) asset="typos-v${VERSION}-x86_64-unknown-linux-musl.tar.gz" ;;
            Darwin/arm64) asset="typos-v${VERSION}-aarch64-apple-darwin.tar.gz" ;;
          esac
          url="https://github.com/crate-ci/typos/releases/download/v${VERSION}/${asset}"
          curl -sSfL "$url" -o "$RUNNER_TEMP/typos.tar.gz"
          mkdir -p "$RUNNER_TEMP/typos-extract"
          tar -xzf "$RUNNER_TEMP/typos.tar.gz" -C "$RUNNER_TEMP/typos-extract" ./typos
          install -m 0755 "$RUNNER_TEMP/typos-extract/typos" "$RUNNER_TEMP/lint-bin/typos"
      - name: Run typos
        id: typos
        continue-on-error: true
        run: typos

      - name: Fail if any lint check failed
        if: always()
        env:
          ACTIONLINT_OUTCOME: ${{ steps.actionlint.outcome }}
          ZIZMOR_OUTCOME: ${{ steps.zizmor.outcome }}
          SHELLCHECK_OUTCOME: ${{ steps.shellcheck.outcome }}
          TYPOS_OUTCOME: ${{ steps.typos.outcome }}
        run: |
          set -euo pipefail
          failed=0
          for check in actionlint zizmor shellcheck typos; do
            outcome_var="${check^^}_OUTCOME"
            outcome="${!outcome_var}"
            if [ "$outcome" != "success" ]; then
              echo "$check: $outcome"
              failed=1
            fi
          done
          exit "$failed"
