# 各リポジトリの .github/workflows/workflow-lint.yml に配置する呼び出し元。
name: workflow-lint

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "**/*.sh"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "**/*.sh"
  # push / pull_request の paths は actionlint・zizmor・shellcheck 向けに絞ってあるため、
  # typos がリポジトリ全体（docs/ や src/）を検査する機会が無い。週次で全ジョブを走らせて
  # そこを埋める（keroway/.github#16）。分はリポジトリごとにずらして同時発火を避けること。
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: keroway/.github/.github/workflows/reusable-workflow-lint.yml@main # zizmor: ignore[unpinned-uses] — 同一アカウント内の自前 reusable workflow。SHA ピン化は Phase 2 で検討
