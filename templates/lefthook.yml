# keroway 標準 lefthook 設定テンプレート（JS/TS リポジトリ向け）。
# https://lefthook.dev/configuration/
#
# 適用時の注意:
# - `pnpm exec` の部分はリポジトリの PM に合わせる（bun の場合 `bunx`）
# - typecheck ジョブはリポジトリの実態に合わせる（astro check / svelte-check / tsc --noEmit）
# - 導入は package.json の postinstall で `lefthook install` を実行する

pre-commit:
  parallel: true
  jobs:
    - name: biome check (staged files)
      glob: "*.{ts,js,mjs,json}"
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    - name: typecheck
      glob: "*.ts"
      run: pnpm exec tsc --noEmit

pre-push:
  jobs:
    - name: test
      run: pnpm test
