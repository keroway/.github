name: Feature request
description: 新機能・改善を提案する
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: motivation
    attributes:
      label: 動機
      description: なぜこの機能が必要か。解決したい課題・ユースケース。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案内容
      description: 具体的にどう実現したいか。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案
      description: 他に検討した方法があれば。
    validations:
      required: false
